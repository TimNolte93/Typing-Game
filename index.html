<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Master</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="container">
        <section class="stats-container">
            <div class="stat-box">APM: <span id="kpm">0</span></div>
            <div class="stat-box">Bester Score: <span id="high-score-display">0</span></div>
            <div class="stat-box">Fehler: <span id="error-count">0</span></div>
        </section>

        <div class="text-display-container" id="display-container">
            <div id="text-display"></div>
        </div>
        
        <textarea id="text-input" spellcheck="false" placeholder="Warte auf Start..."></textarea>

        <div id="start-overlay">
            <button id="start-btn">Spiel Starten</button>
        </div>
    </main>

    <div id="result-modal" class="modal">
        <div class="modal-content">
            <h2>Ergebnis</h2>
            <p style="font-size: 1.5rem; margin-bottom: 20px;">
                <span id="final-rating"></span>
            </p>
            <div class="score-container" style="margin: 20px 0;">
                <span style="font-size: 1.2rem; color: var(--sub-color);">DEIN SCORE:</span>
                <div id="final-score" style="font-size: 3.5rem; color: var(--main-color); font-weight: bold;">0</div>
            </div>
            
            <p>Zeit: <span id="final-time">0</span>s</p>
            <p>Fehler: <span id="final-errors">0</span></p>
            <p>APM: <span id="final-apm">0</span></p>
            <p>Genauigkeit: <span id="final-accuracy">0</span>%</p>
            <button onclick="location.reload()" class="restart-btn">Nochmal versuchen</button>
        </div>
    </div>

    <script src="js/words.js"></script>    
    <script src="js/script.js"></script>
</body>
</html>
